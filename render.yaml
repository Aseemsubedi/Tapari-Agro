services:
  - type: web
    name: tapari-agro
    runtime: docker
    plan: starter
    healthCheckPath: /
    disk:
      name: tapari-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: DATABASE_URL
        value: file:/data/prod.db
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_PHONE
        value: "9857620569"
      - key: NEXT_PUBLIC_WHATSAPP
        value: "9779857620569"
